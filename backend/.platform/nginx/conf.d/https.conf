# HTTPS termination on the single EC2 instance itself (no Load Balancer) —
# lets Cloudflare's SSL/TLS mode be set to "Full" or "Full (strict)"
# instead of "Flexible", so traffic between Cloudflare and this origin
# is actually encrypted, not just between the visitor and Cloudflare.
#
# Certificate files are written by
# .platform/hooks/predeploy/01_write_ssl_certs.sh from EB Environment
# Properties — if that hook hasn't run yet (or the env vars aren't set),
# nginx will fail to start. Deploy the env vars FIRST, then this config.

server {
    listen 443 ssl;
    server_name backend.mob13r.com;

    ssl_certificate     /etc/nginx/ssl/cf-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;
    client_body_buffer_size 1M;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass          http://127.0.0.1:8080;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto https;
    }
}
